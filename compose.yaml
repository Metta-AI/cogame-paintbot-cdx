services:
  game:
    image: cogame-paintbot-cdx:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SIM_SOURCES_STAMP: ${SIM_SOURCES_STAMP:-}
    ports:
      - "8080:8080"
    volumes:
      - ${COWORLD_WORKDIR:-./singlepod/runs/container}:/coworld
    environment:
      COGAME_PLAYER_SEATS_URI: file:///coworld/seats.json
      COGAME_CONFIG_URI: file:///coworld/config.json
      COGAME_RESULTS_URI: file:///coworld/results.json
      COGAME_SAVE_REPLAY_URI: file:///coworld/replay.bin
      COGAME_PLAYER_FAILURE_URI: file:///coworld/player_failure.json
